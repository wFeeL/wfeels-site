services:
  api:
    build: ../api
    env_file: .env
    restart: unless-stopped
    expose: ["8000"]
    # Код и системная файловая система только для чтения. Запись разрешена лишь
    # в два постоянных тома: первичная база заявок и локальные резервные копии.
    read_only: true
    tmpfs: ["/tmp"]
    volumes:
      - leads_data:/data
      - leads_backups:/backups
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    # Драйвер по умолчанию логи не ротирует. Полный текст заявки в журналы не
    # пишется даже при сбое Telegram; здесь остаются технические события.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    depends_on: [api]
    restart: unless-stopped
    ports: 
      - "127.0.0.1:8088:80"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../web/dist:/srv/site:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt: ["no-new-privileges:true"]
    # Всё, кроме права занять порты ниже 1024. `read_only` тут не ставится:
    # Caddy пишет сертификаты в `/data` и конфигурацию в `/config`.
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
  leads_data:
  leads_backups:
