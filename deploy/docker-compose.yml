services:
  api:
    build: ../api
    env_file: .env
    restart: unless-stopped
    expose: ["8000"]

  caddy:
    image: caddy:2-alpine
    depends_on: [api]
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../web/dist:/srv/site:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
