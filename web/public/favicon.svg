<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Знак бренда: акцентный квадрат со скруглением и монограмма «w». Цвета здесь
       заданы литералом #2F5BFF — единственное разрешённое брифом исключение из
       правила «цвета только из токенов»: файл в public/ отдаётся как есть,
       CSS-переменные до него не доходят. Буква нарисована контуром <path>, а не
       <text>, чтобы не зависеть от шрифтов машины, которая открывает файл. -->
  <rect width="32" height="32" rx="7" fill="#2F5BFF" />
  <path
    d="M7 9 L12.5 23 L16 15 L19.5 23 L25 9"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="3.4"
    stroke-linecap="butt"
    stroke-linejoin="miter"
  />
</svg>
